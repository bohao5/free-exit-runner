name: free-exit-runner
run-name: free-exit-runner-${{ github.run_number }}
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
concurrency:
  group: free-exit
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  exit:
    name: exit-socks
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: socks-multi-bore-supervisor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -u

          if ! command -v microsocks >/dev/null 2>&1; then
            sudo apt-get update -y || true
            if ! sudo apt-get install -y microsocks; then
              sudo apt-get install -y build-essential git
              git clone --depth=1 https://github.com/rofl0r/microsocks /tmp/microsocks
              make -C /tmp/microsocks
              sudo install -m 755 /tmp/microsocks/microsocks /usr/local/bin/
            fi
          fi

          U="u_$(openssl rand -hex 4)"
          P="$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 24)"

          microsocks -i 127.0.0.1 -p 1080 -u "$U" -P "$P" >/tmp/microsocks.log 2>&1 &
          MS_PID=$!
          sleep 1
          ss -ltnp | grep 1080 || true

          if ! command -v bore >/dev/null 2>&1; then
            mkdir -p /tmp/bore && cd /tmp/bore
            curl -sSL -o bore.tgz https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
            tar xzf bore.tgz
            sudo install -m 755 bore /usr/local/bin/ 2>/dev/null || install -m 755 bore /usr/local/bin/
            cd /
          fi

          start_bore() {
            : > "/tmp/bore_$1.log"
            nohup bore local 1080 --to bore.pub > "/tmp/bore_$1.log" 2>&1 &
            echo $!
          }
          port_of() {
            grep -E 'listening at' "/tmp/bore_$1.log" 2>/dev/null | head -1 | sed -E 's/.*listening at //' | grep -Eo 'bore\.pub:[0-9]+' | head -1
          }

          declare -A BPID BEP
          for i in 1 2 3; do
            BPID[$i]=$(start_bore $i)
            for k in $(seq 1 12); do sleep 3; [ -n "$(port_of $i)" ] && break; done
            BEP[$i]=$(port_of $i)
            echo "SLOT $i pid=${BPID[$i]} ep=${BEP[$i]:-none}"
            cat "/tmp/bore_$i.log" || true
          done

          # 运行器侧分层诊断（直连 vs 经 microsocks），结果同时推 ntfy
          DIAG=""
          for t in https://www.google.com/generate_204 https://github.com https://chatgpt.com https://www.microsoft.com https://hub.docker.com; do
            dc=$(curl -s -o /dev/null -w '%{http_code}' --max-time 12 -4 "$t" || true)
            sc=$(curl -s -o /dev/null -w '%{http_code}' --max-time 12 -4 --proxy "socks5h://$U:$P@127.0.0.1:1080" "$t" || true)
            echo "DIAG $t direct=$dc socks=$sc"
            DIAG="$DIAG|$t:$dc/$sc"
          done

          TRACE=$(curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace || true)
          IPINFO=$(curl -s --max-time 15 https://ipinfo.io/json || true)
          RUNNER_IP=$(echo "$TRACE" | sed -n 's/^ip=//p')
          ASN=$(echo "$IPINFO" | sed -n 's/.*"org": *"\([^"]*\)".*/\1/p')

          publish() {
            EPS=""
            for i in 1 2 3; do [ -n "${BEP[$i]:-}" ] && EPS="$EPS ${BEP[$i]}"; done
            if [ -n "${NTFY_TOPIC:-}" ]; then
              curl -sS --max-time 15 -d "eps=$EPS user=$U pass=$P runner_ip=$RUNNER_IP asn=$ASN ts=$(date +%s) job=${GITHUB_RUN_ID} diag=$DIAG" "https://ntfy.sh/$NTFY_TOPIC" || true
            fi
            echo "::notice::EXIT_EPS=$EPS"
          }
          publish

          DEADLINE=$(( $(date +%s) + 19200 ))
          C=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            sleep 20
            C=$((C+1))
            CHANGED=0
            for i in 1 2 3; do
              if ! kill -0 "${BPID[$i]}" 2>/dev/null; then
                echo "SLOT $i dead, restart"
                BPID[$i]=$(start_bore $i)
                for k in $(seq 1 12); do sleep 3; [ -n "$(port_of $i)" ] && break; done
                NEWEP=$(port_of $i)
                if [ -n "$NEWEP" ]; then BEP[$i]=$NEWEP; CHANGED=1; fi
              fi
            done
            if [ "$CHANGED" = "1" ] || [ $((C % 30)) -eq 0 ]; then
              publish
            fi
          done
          echo "SUPERVISOR_DONE"
          for i in 1 2 3; do kill "${BPID[$i]}" 2>/dev/null || true; done
          kill "$MS_PID" 2>/dev/null || true
